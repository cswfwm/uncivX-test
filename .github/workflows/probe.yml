name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          echo "len=${#KEYSTORE_B64}"
          echo "alias=$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

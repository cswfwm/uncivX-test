name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=${{ secrets.CI_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=${{ secrets.CI_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=${{ secrets.CI_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :android:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: uncivx-release
          path: android/build/outputs/apk/release/*.apk

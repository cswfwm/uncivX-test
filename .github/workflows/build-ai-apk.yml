name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      # Signing material lives in the repo so consecutive builds share one certificate and can
      # upgrade each other; a per-build key would force an uninstall before every update.
      - name: Prepare signing
        run: |
          base64 -d signing/keystore.b64 > "$RUNNER_TEMP/release.jks"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=uncivx2026" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=uncivx" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=uncivx2026" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :android:assembleRelease --no-daemon

      # Publish into the repo and keep only the five newest APKs.
      - name: Publish APK
        run: |
          mkdir -p release
          STAMP=$(date -u +%Y%m%d-%H%M)
          cp android/build/outputs/apk/release/*.apk "release/UncivX-4.22.4.4-${STAMP}.apk"
          ls -1t release/*.apk | tail -n +6 | xargs -r rm -f
          ls -lt release

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release
          git diff --cached --quiet || git commit -m "Add build artifact"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: uncivx-release
          path: android/build/outputs/apk/release/*.apk

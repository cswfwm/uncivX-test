name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      # The keystore is a repository secret so every build is signed with the same key.
      # A fresh key per build would make each APK un-installable over the previous one.
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.CI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=${{ secrets.CI_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=${{ secrets.CI_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=${{ secrets.CI_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :android:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uncivx-release
          path: android/build/outputs/apk/release/*.apk
          retention-days: 30

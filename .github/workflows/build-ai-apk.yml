name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      # Signing material lives in the repo so consecutive builds share one certificate and can
      # upgrade each other; a per-build key would force an uninstall before every update.
      - name: Prepare signing
        run: |
          base64 -d signing/keystore.b64 > "$RUNNER_TEMP/release.jks"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=uncivx2026" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=uncivx" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=uncivx2026" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :android:assembleRelease --no-daemon

      # Publish into the repo and keep only the five newest APKs.
      - name: Publish APK
        id: publish
        run: |
          mkdir -p release
          VERSION=$(grep -oP 'appVersion = "\K[^"]+' buildSrc/src/main/kotlin/BuildConfig.kt)
          TAG="V${VERSION}"
          STAMP=$(date -u +%Y%m%d-%H%M)
          OUT="release/uncivCN-X-${TAG}-${STAMP}.apk"
          cp android/build/outputs/apk/release/*.apk "$OUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -1t release/*.apk | tail -n +6 | xargs -r rm -f
          ls -lt release

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release
          git diff --cached --quiet || git commit -m "Add build artifact"
          git push

      # The in-game updater reads GitHub releases of this repository, so publish one per build.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.publish.outputs.tag }}
          name: uncivCN-X ${{ steps.publish.outputs.version }}
          files: ${{ steps.publish.outputs.apk }}
          make_latest: true

      - uses: actions/upload-artifact@v7
        with:
          name: uncivx-release
          path: android/build/outputs/apk/release/*.apk
